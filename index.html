<!DOCTYPE html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Сабақ қалай өтті?</title><style>
:root{--t:#4a2511;--cd:#fff6e8;--ac:#f6c445;--bd:#e9d5b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--t);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(ellipse 90% 40% at 20% 105%,#d9743c 0 60%,transparent 61%),radial-gradient(ellipse 80% 35% at 85% 108%,#b4552b 0 60%,transparent 61%),linear-gradient(180deg,#ffd98a,#ffb56b 55%,#f08a4b);background-attachment:fixed}
main{max-width:1100px;margin:0 auto;padding:14px 16px 40px;text-align:center}
h1{font-size:clamp(2rem,6vw,3.4rem);margin:8px 0 14px;text-shadow:0 3px 0 #fff8}
.panel{background:var(--cd);border-radius:28px;padding:16px;box-shadow:0 8px 0 #0002,0 0 0 3px #fff8 inset}
.qr{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;margin-bottom:18px}.qr #qc{background:#fff;padding:10px;border-radius:16px;min-width:140px;min-height:140px}.qr p{margin:0;text-align:left;font-size:1.25rem;font-weight:800;max-width:420px}.qr small{display:block;font-weight:600;font-size:.85rem;word-break:break-all;opacity:.75;margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:10px 0 18px}
.cd{position:relative;background:var(--cd);border-radius:28px;padding:12px 14px 14px;box-shadow:0 8px 0 #0002;border:4px solid transparent;transition:.3s}
.cd.w{border-color:var(--ac);box-shadow:0 0 34px #ffd34e,0 8px 0 #0002;transform:scale(1.03)}
.cd i{position:absolute;left:12px;top:12px;background:#0001;border-radius:10px;padding:2px 9px;font-style:normal;font-weight:800}
.cd .n{position:absolute;right:12px;top:10px;background:var(--ac);border-radius:22px;padding:2px 18px;font-size:1.8rem;box-shadow:0 4px 0 #0002;min-width:58px}
.cd .f{font-size:clamp(3.5rem,9vw,6rem);margin:30px 0 4px;line-height:1.1}.cd .f img{max-width:100%;max-height:150px;border-radius:12px}
.cd .cr{position:absolute;right:12px;bottom:70px;font-size:1.6rem}
.cd .r{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin:8px 4px 6px}
.bar{height:16px;background:#0001;border-radius:10px;overflow:hidden}.bar div{height:100%;border-radius:10px;transition:width .5s;background:var(--c)}
.tot{font-size:1.9rem;font-weight:900;margin:6px 0 12px;text-align:left}.tot b{font-size:3.4rem;margin-left:8px;vertical-align:middle;-webkit-text-stroke:2px #fff}
.bt{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.bt button,.go{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:18px;padding:14px 22px;font-size:1.15rem;font-weight:800;background:#fff;box-shadow:0 5px 0 #0002;flex:1 1 200px}
.bt .p{background:linear-gradient(#ffe28a,#f6c445)}.bt .d{background:#3b1a0b;color:#fff}.bt .r{color:#d3261b}.bt button:active{transform:translateY(3px)}
.hint{text-align:left;margin:14px 6px 0;font-weight:700}.st{display:inline-block;background:#fff9;border-radius:20px;padding:4px 14px;font-weight:700;margin:8px 0}
.ov{position:fixed;inset:0;background:#2b1306cc;z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}.ov .panel{max-width:760px;width:100%;font-size:1.35rem}.ov h2{font-size:2.2rem;margin:0 0 10px}
.sb{display:grid;gap:14px;margin:14px 0}.sb button{font:inherit;cursor:pointer;border:0;border-radius:26px;padding:20px;font-size:clamp(1.4rem,6vw,2.1rem);font-weight:900;color:var(--t);background:var(--cd);box-shadow:0 7px 0 #0002;display:flex;align-items:center;gap:16px;text-align:left}
.sb button span{font-size:3.2rem}.sb button.on{background:var(--ac);box-shadow:0 0 30px #ffd34e,0 7px 0 #0002;transform:scale(1.03)}.sb button:active{transform:scale(.97)}
@media(max-width:720px){.cards{grid-template-columns:1fr}.cd .f{margin-top:20px}}
</style></head><body><main>
<h1>Сабақ қалай өтті?</h1>
<section id="bd" hidden>
<div class="panel qr"><div id="qc"></div><p>📱 Телефонның камерасымен сканерлеп, жауабыңды таңда<small id="lk"></small></p></div>
<div class="cards" id="cards"></div>
<div class="tot">Барлық дауыс <b id="tot">0</b></div>
<div class="panel"><div class="bt"><button class="p" id="bs">🏆 Қорытынды</button><button id="bu">↩ Дауысты болдырмау</button><button class="r" id="br">⟲ Нәтижелерді тазалау</button><button id="bc">⬇ CSV экспорт</button><button class="d" id="bm">🔊 Дыбыс</button></div></div>
<div class="hint">1–3 пернелері – нұсқаға дауыс беру, F – толық экран</div><div class="st" id="cn">Қосылуда…</div>
</section>
<section id="sd" hidden><p style="font-size:1.4rem;font-weight:700;margin:0">Бүгінгі сабақ саған қалай болды? Бір жауапты таңда:</p><div class="sb" id="sb"></div><div class="st" id="sm">Таңдау жасаңыз 👇</div></section>
</main>
<div class="ov" id="ov" hidden><div class="panel"><h2>🏆 Қорытынды</h2><div id="ob"></div><p><button class="go" id="oc">Жабу</button></p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const NT='https://ntfy.sh/',LB=['Түсініксіз болды','Сұрақтар қалды','Барлығы түсінікті'],FC=['😕','🤔','😄'],CL=['#e5484d','#f5a623','#22c55e'];
const IMG=['','',''];/* қаласаңыз, үш сурет сілтемесін осында жазыңыз: ['1.png','2.png','3.png'] */
const $=s=>document.querySelector(s),rnd=n=>Array.from({length:n},()=>'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*32)]).join('');
const P=new URLSearchParams(location.search).get('s');
function pub(m){return fetch(NT+(P||sid),{method:'POST',body:JSON.stringify(m)}).then(r=>{if(!r.ok)throw 0})}
let sid,ev=[],seen=new Set(),snd=1,AC;
function beep(f=660){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.25,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.3);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.3)}catch(e){}}
if(P){/* ОҚУШЫ БЕТІ */
 $('#sd').hidden=0;let uid=localStorage.kzu||(localStorage.kzu=rnd(10)),my=localStorage.kzv;
 const draw=()=>{$('#sb').innerHTML=LB.map((l,k)=>`<button data-k="${k}" class="${my==k?'on':''}"><span>${IMG[k]?`<img src="${IMG[k]}" width="64">`:FC[k]}</span>${l}</button>`).join('')};draw();
 $('#sb').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=+b.dataset.k;$('#sm').textContent='Жіберілуде…';
  pub({u:uid,v:k}).then(()=>{my=k;localStorage.kzv=k;draw();$('#sm').textContent='Рахмет! Дауысың қабылданды ✅ (қаласаң, өзгерте аласың)'}).catch(()=>{$('#sm').textContent='Байланыс жоқ ⚠️ Қайта басып көр'})};
}else{/* ТАҚТА */
 $('#bd').hidden=0;sid=localStorage.kzs||(localStorage.kzs='kz'+rnd(18));
 const link=location.origin+location.pathname+'?s='+sid;$('#lk').textContent=link;
 const qr=()=>{$('#qc').innerHTML='';if(window.QRCode)new QRCode($('#qc'),{text:link,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});else $('#qc').textContent='QR жүктелмеді. Төмендегі сілтемені қолданыңыз'};qr();
 function cnt(){const M={};ev.forEach(e=>M[e.u]=e.v);const c=[0,0,0];Object.values(M).forEach(v=>c[v]++);return c}
 function render(){const c=cnt(),tot=c[0]+c[1]+c[2],mx=Math.max(...c);$('#tot').textContent=tot;
  $('#cards').innerHTML=c.map((n,k)=>{const p=tot?Math.round(n*100/tot):0,w=mx>0&&n===mx;return `<div class="cd ${w?'w':''}" style="--c:${CL[k]}"><i>${k+1}</i><b class="n">${n}</b><div class="f">${IMG[k]?`<img src="${IMG[k]}">`:FC[k]}</div>${w?'<span class="cr">👑</span>':''}<div class="r"><span>${LB[k]}</span><span>${p}%</span></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join('')}
 function apply(m,id,tm){if(seen.has(id))return;seen.add(id);if(m.r)ev=[];else if(m.x)ev=ev.filter(e=>e.mid!==m.x);else if(m.v>=0&&m.v<3){ev.push({mid:id,u:String(m.u),v:m.v,t:tm});beep(520+m.v*180)}render()}
 function conn(){const es=new EventSource(NT+sid+'/sse?since=all');
  es.onopen=()=>$('#cn').textContent='Желіге қосылды ✅';es.onerror=()=>$('#cn').textContent='Байланыс жоқ… қайта қосылуда ⏳';
  es.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(x){return}if(d.event!=='message')return;let m;try{m=JSON.parse(d.message)}catch(x){return}apply(m,d.id,d.time*1000)}}
 conn();render();
 const T=()=>'t'+rnd(8);
 const vote=k=>pub({u:T(),v:k}).catch(()=>$('#cn').textContent='Дауыс жіберілмеді ⚠️');
 $('#bu').onclick=()=>{if(ev.length)pub({x:ev[ev.length-1].mid}).catch(()=>{})};
 $('#br').onclick=()=>{if(confirm('Барлық нәтижені тазалау керек пе?'))pub({r:1}).catch(()=>{})};
 $('#bm').onclick=()=>{snd=!snd;$('#bm').textContent=snd?'🔊 Дыбыс':'🔇 Дыбыссыз';beep()};
 $('#bc').onclick=()=>{const M={};ev.forEach(e=>M[e.u]=e);const rows=[['№','Уақыт','Оқушы (жасырын)','Жауап']].concat(Object.values(M).map((e,i)=>[i+1,new Date(e.t).toLocaleString('kk-KZ'),e.u.slice(0,6),LB[e.v]]));const c=cnt();rows.push([],['Жиыны','','',''],...LB.map((l,k)=>['',l,'',c[k]]));
  const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='sabak-nátije.csv'.replace('á','a');a.click()};
 $('#bs').onclick=()=>{const c=cnt(),tot=c[0]+c[1]+c[2];let msg;if(!tot)msg='Әзірге дауыс жоқ. Оқушылар QR-ды сканерлесін.';else{const p=c.map(n=>Math.round(n*100/tot));
  msg=p[2]>=70?'Тамаша! Тақырып көпшілікке түсінікті. Жаңа тақырыпқа өтуге болады 🎉':p[0]>=30?'Тақырыпты басқаша, мысалмен қайта түсіндіріп шығу керек 🔁':c[1]>=c[2]?'Сұрақтар көп қалды. Оларды бірге талқылайық 💬':'Көпшілік түсінді. Қалған сұрақтарға жауап берейік ✅'}
  $('#ob').innerHTML=`<p>Барлығы: <b>${tot}</b> дауыс</p>`+c.map((n,k)=>`<p>${FC[k]} ${LB[k]}: <b>${n}</b>${tot?' ('+Math.round(n*100/tot)+'%)':''}</p>`).join('')+`<p><b>${msg}</b></p>`;$('#ov').hidden=0};
 $('#oc').onclick=()=>$('#ov').hidden=1;
 addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='3')vote(+e.key-1);else if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}else if(e.key==='Escape')$('#ov').hidden=1});
 window.addEventListener('load',()=>{if(!$('#qc').children.length)qr()});
}
</script></body></html>
